<!DOCTYPE html>
<html lang="en">
    <link href="styles.css" rel="stylesheet" type="text/css">
    <head>
        <title>Home</title>
        <meta charset="utf-8">
    </head>
   
    <body>      
        <div id="header"></div>           
        
        <h1>Beeeee not afraid!</h1>

            <input type="text"
            placeholder="Search..">

        <iframe
            width="420"
            height="315"

        </iframe>  
        
        <div id="footer"></div>

        <script>
            fetch('header.html')
                .then(response => response.text())

                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer').innerHTML = data;
                });
        </script>

</html>
