<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--EXTERNAL SCRIPT REFERENCE-->
        <link href="css/styles.css" rel="stylesheet" type="text/css">
        <script src="js/site-config.js" defer></script>
        <script src="js/back-to-top.js" defer></script>
        <script src="js/components.js" defer></script>
        <script src="js/project-search.js" defer></script>
        
        <title>Home</title>
        <meta charset="utf-8">
    </head>
   
    <body>      
        <!--HEADER-->
        <div id="header"></div>           
        
        <!--CHANGE SOURCE FOR NEW VIDEO-->
        <div class="home-video-container">
            <video class="background-video" autoplay muted loop playsinline>
                <source src="videos/demo-reel.mp4" type="video/mp4">
            </video>

            <div class="video-controls">
                <a 
                    title="Check out the 2025 Demo Reel on YouTube!"
                    class="video-youtube-link"
                    href="https://youtu.be/b_jfp6dj1tg"
                    target="_blank"
                    rel="noopener noreferrer"
                    alt="Youtube Button">
                    <span class="icon-youtube"></span>
                </a>
            </div>
        </div>

        <div class="wrapper">
            <h1>Beeeee not afraid!</h1>     
            <h3 class="specialty">
                <ul>
                    <li>graphics</li>
                    <li>illustration</li>
                    <li>3D design</li>
                </ul>
            </h3>

            <!--SEARCH BAR-->
            <div class="search-box">
                <div>
                    <h3>Looking for a specific project?</h3>
                </div>

                <div class="row">
                    <form onsubmit="return false;">
                        <input
                            type="text"
                            id="input-box"
                            placeholder="Type here..."
                            autocomplete="off"
                        >
                    </form>
                </div>
            </div>

            <!-- PROJECT GRID -->
            <div class="project-grid" id="project-grid">
            </div>

            <p id="no-results" style="display: none;" class="bold italic">
                No Projects Found
            </p>
        
        <button class="button-pink">
            <a href="works.html">
                <p>Other Works!</p>
            </a>
        </button>

        </div>
        
        <!--FOOTER-->
        <div id="footer"></div>
    </body>
</html>
