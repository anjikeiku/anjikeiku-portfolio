<!DOCTYPE html>
<html lang="en">
    <!--EXTERNAL SCRIPT REFERENCE-->
    <link href="css/styles.css" rel="stylesheet" type="text/css">
    <script src="js/components.js"></script>
    <script src="js/project-search.js"></script>
    <script src="js/back-to-top.js"></script>

    <head>
        <title>Home</title>
        <meta charset="utf-8">
    </head>
   
    <body>      
        <!--HEADER-->
        <div id="header"></div>           
        
        <!--CHANGE SOURCE FOR NEW VIDEO-->
        <div class="video-container">
            <video class="background-video" autoplay muted loop playsinline>
                <source src="videos/demo-reel.mp4" type="video/mp4">
            </video>

            <div class="video-controls">
                <a 
                    title="Check out the 2025 Demo Reel on YouTube!"
                    class="video-youtube-link"
                    href="https://youtu.be/b_jfp6dj1tg"
                    target="_blank"
                    rel="noopener noreferrer"
                    alt="Youtube Button">
                    <span class="icon-youtube"></span>
                </a>
            </div>
        </div>

        <div class="wrapper">
            <h1>Beeeee not afraid!</h1>     

            <p>I'm Anji! A <span class="bold pink">Multimedia Artist</span>, brand builder, problem solver, and bonafide Angel!<br>
            Check out my most recent projects!</p>

            <!--SEARCH BAR-->
            <div class="search-box">
                <div>
                    <p>Looking for a specific project?</p>
                </div>
                <div class="row">
                    <form>
                        <input type="text"
                        id="input-box"
                        placeholder="Type here..." 
                        autocomplete=off>
                    </form>
                </div>
            </div>

            <!--PROJECT GRID-->
            <div class="project-grid" id="project-grid">
                <!--PROJECT CARDS-->
            </div>

            <p id="no-results"> No projects found</p>
        
        <button class="button-pink" title="View the Collection">
            <p>View the Collection!</p>
        </button>

        <!--FOOTER-->
        <div id="footer"></div>
    </body>
</html>
