<!DOCTYPE html>
<html lang="en">
    <link href="styles.css" rel="stylesheet" type="text/css">
    <head>
        <title>Home</title>
        <meta charset="utf-8">
    </head>
   
    <body>      
        <!--HEADER-->
        <div id="header"></div>           
        
        <!--CHANGE SOURCE FOR NEW VIDEO-->
        <div>
            <iframe
                class="yt_video-demo_reel"
                src="https://www.youtube-nocookie.com/embed/b_jfp6dj1tg?autoplay=1&mute=1&controls=0"
                title="YouTube video player"
                style="aspect-ratio: 16 / 9;"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
            </iframe>
        </div>

        <div class="wrapper">
            <h1>Beeeee not afraid!</h1>     

            <p>I'm Anji! A <span class="bold pink">Multimedia Artist</span>, brand builder, problem solver, and bonafide Angel!<br>
            Check out my most recent projects!</p>

            <!--SEARCH BAR-->
            <div class="search-box">
                <div>
                    <p>Looking for a specific project?</p>
                </div>
                <div class="row">
                    <input type="text" id="input-box" placeholder="Type here..." autocomplete=off>
                </div>
            </div>
            
            <button class="button-pink">
                <p>View the Collection!</p>
            </button>
        </div>
        
        <!--FOOTER-->
        <div id="footer"></div>

        <!--JAVASCRIPT FETCH HEADER FOOTER-->
        <script>
            fetch('header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header').innerHTML = data;
                });

            fetch('footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer').innerHTML = data;
                });
        </script>
    </body>
</html>
